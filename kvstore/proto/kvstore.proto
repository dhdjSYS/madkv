syntax = "proto3";

package kvstore;

option go_package = "kvstore/pb";

service KvStore {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Swap(SwapRequest) returns (SwapResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

service Manager {
  rpc RegisterServer(RegisterServerRequest) returns (RegisterServerResponse);
  rpc DiscoverServers(DiscoverServersRequest) returns (DiscoverServersResponse);
}

// Raft runs on a differenr t p2p port and a different service that only has 2 rtpc c alls according to the paper
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool found = 1;
}

message SwapRequest {
  string key = 1;
  string value = 2;
}

message SwapResponse {
  bool found = 1;
  string old_value = 2;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  string value = 2;
}

message ScanRequest {
  string key_start = 1;
  string key_end = 2;
}

message ScanResponse {
  repeated KeyValue entries = 1;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool found = 1;
}

message RegisterServerRequest {
  int32 partition_id = 1;
  int32 replica_id = 2; //new replica id for p3
}

message RegisterServerResponse {
  bool accepted = 1;
}

message DiscoverServersRequest {}

message DiscoverServersResponse {
  int32 num_partitions = 1;
  int32 replication_factor = 2;
  repeated PartitionGroup partitions = 3;
}

message PartitionGroup {
  int32 partition_id = 1;
  repeated ServerInfo replicas = 2;
}

message ServerInfo {
  int32 replica_id = 1;
  string address = 2;
}

// KVCommand is the state machine command serialized into the Raft log.
message KVCommand {
  enum Op {
    OP_UNKNOWN = 0;
    OP_PUT = 1;
    OP_SWAP = 2;
    OP_DELETE = 3;
    OP_GET = 4;
    OP_SCAN = 5;
  }
  Op op = 1;
  string key = 2;
  string value = 3;
  string key_end = 4;
}

message KVResult {
  bool found = 1;
  string value = 2;
  repeated KeyValue entries = 3;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  bytes command = 3;
}

message RequestVoteRequest {
  int64 term = 1;
  int32 candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
  bool pre_vote = 5;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  int32 leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 conflict_index = 3;
}
